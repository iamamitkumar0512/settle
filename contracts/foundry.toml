[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Deterministic bytecode makes Blockscout verification less fiddly.
bytecode_hash = "none"

[profile.default.fmt]
line_length = 110
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
whitechain_sepolia = "${RPC_URL}"

[etherscan]
whitechain_sepolia = { key = "", url = "https://explorer.testnet.whitechain.io/api", chain = 1874 }
